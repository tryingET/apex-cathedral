openapi: 3.1.0
info:
  title: Apex Cathedral Gateway
  version: 0.1.0
  description: Local-first execution runtime for governed agent capabilities.
servers:
  - url: http://localhost:4100
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy
  /openapi.yaml:
    get:
      summary: Fetch the OpenAPI document
      responses:
        "200":
          description: YAML document
  /capabilities:
    get:
      summary: List capabilities
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityListResponse"
  /capabilities/{name}:
    get:
      summary: Get one capability
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capability details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResponse"
        "404":
          description: Not found
  /executions:
    get:
      summary: List executions
      responses:
        "200":
          description: Execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionListResponse"
    post:
      summary: Create an execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionRequest"
      responses:
        "201":
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: Invalid request
  /executions/{id}:
    get:
      summary: Get one execution
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "404":
          description: Not found
  /approvals:
    get:
      summary: List approvals
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
  /approvals/{id}/approve:
    post:
      summary: Approve an execution
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approved_by:
                  type: string
      responses:
        "200":
          description: Approval updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "404":
          description: Not found
  /approvals/{id}/deny:
    post:
      summary: Deny an execution
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                denied_by:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Approval updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "404":
          description: Not found
  /resources:
    get:
      summary: List active resources
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
  /events:
    get:
      summary: Query audit events
      parameters:
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: workspace_id
          schema:
            type: string
        - in: query
          name: entity_id
          schema:
            type: string
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
  /events/stream:
    get:
      summary: Stream audit events using server-sent events
      responses:
        "200":
          description: Event stream
components:
  schemas:
    Capability:
      type: object
      required:
        - name
        - description
        - input_schema
        - output_schema
        - effect_type
        - destructive_flag
        - resource_scope
        - approval_requirement
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
        output_schema:
          type: object
        effect_type:
          type: string
          enum: [READ, WRITE, DESTRUCTIVE, EXTERNAL_SIDE_EFFECT]
        destructive_flag:
          type: boolean
        resource_scope:
          type: string
        approval_requirement:
          type: string
        provider:
          type: string
          nullable: true
    Execution:
      type: object
      properties:
        id:
          type: string
        request_id:
          type: string
        workspace_id:
          type: string
        capability:
          type: string
        arguments:
          type: object
        requested_by:
          type: string
        mode:
          type: string
        state:
          type: string
          enum: [REQUESTED, POLICY_EVALUATED, PENDING_APPROVAL, APPROVED, RUNNING, COMPLETED, FAILED, DENIED, TIMED_OUT]
        policy_decision:
          type: object
          nullable: true
        approval_id:
          type: string
          nullable: true
        resource_scope:
          type: string
        started_at:
          type: string
          nullable: true
        completed_at:
          type: string
          nullable: true
        updated_at:
          type: string
        result:
          type: object
          nullable: true
        error:
          nullable: true
        transitions:
          type: array
          items:
            type: object
    Approval:
      type: object
      properties:
        approval_id:
          type: string
        execution_id:
          type: string
        capability:
          type: string
        arguments:
          type: object
        requested_by:
          type: string
        status:
          type: string
        timestamp:
          type: string
        updated_at:
          type: string
        approved_by:
          type: string
          nullable: true
        denied_by:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        scope:
          type: string
        workspace_id:
          type: string
        owner_pid:
          type: string
        status:
          type: string
        metadata:
          type: object
        inserted_at:
          type: string
        updated_at:
          type: string
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          nullable: true
        workspace_id:
          type: string
          nullable: true
        actor:
          type: string
          nullable: true
        payload:
          type: object
        inserted_at:
          type: string
    CapabilityListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    CapabilityResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Capability"
    ExecutionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Execution"
    ExecutionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
    ApprovalResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Approval"
    ApprovalListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    AuditEventListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    CreateExecutionRequest:
      type: object
      required:
        - workspace_id
        - requested_by
        - capability
      properties:
        workspace_id:
          type: string
        requested_by:
          type: string
        capability:
          type: string
        mode:
          type: string
          enum: [EXECUTE, DRY_RUN]
          default: EXECUTE
        arguments:
          type: object
