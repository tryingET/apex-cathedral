# apex-cathedral in System4D terms.
# A softwareco owned repo: a local-first execution runtime for AI agents on the BEAM (Elixir umbrella, TypeScript SDK and UI).
# Written for the agents that work in and beside this repo: read it before
# changing what the repo does or how. README.md, AGENTS.md and docs/project/
# hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "apex-cathedral"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "An Elixir/OTP umbrella (apps/runtime, policy, audit, resources, providers) that turns agent capability requests into policy-checked, optionally approved, audited executions"
          - "A Plug gateway on localhost:4100 (apps/gateway) whose HTTP API is docs/openapi.yaml, mirrored to apps/gateway/priv/openapi.yaml"
          - "Supervised per-workspace resources (WorkspaceFS, WorkspaceSQLite, a mock AccountSession) stored under var/apex or APEX_STORAGE_ROOT, with audit events in audit/events.jsonl"
          - "A TypeScript SDK (apps/ts-sdk, @tryinget/apex-cathedral-sdk) and a local UI on localhost:5173 (apps/ui)"
          - "scripts/cathedral_generator.py: drafts v1, critiques it as Skeptic and Simplifier, finalizes v3, validates invariants and emits a regenerated repository snapshot"
        out_of_scope:
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; docs and governance/work-items.json are projections"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
          - "Runtime authority in TypeScript: the SDK and UI are clients of the gateway"
          - "Real external accounts: the only provider is a mock account (Apex.Providers.MockAccount)"
      constraints:
        - "Elixir 1.17+ on Erlang/OTP 27+ for the runtime; TypeScript on Node.js 20+ for the SDK and UI; the SQLite toolchain that exqlite needs"
        - "Fewer than 20 core runtime modules (docs/architecture/architecture_v3.md)"
        - "Approvals time out after 60 s and executions after 30 s (config/config.exs)"
      edges:
        - name: "Execution, approval and audit API"
          direction: "bi"
          protocol: "http"
          system: "Agents, the TypeScript SDK and the UI"
          contract: "docs/openapi.yaml (served at GET /openapi.yaml; audit events on GET /events/stream)"
        - name: "SDK package"
          direction: "out"
          protocol: "npm"
          system: "registry.npmjs.org"
          contract: ".github/workflows/publish-ts-sdk.yml (manual workflow_dispatch)"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown"
        - name: "core/ontology-kernel and softwareco ontology"
          type: "build"
          note: "The core and company ontology layers, referenced at @main in ontology/manifest.yaml"
        - name: "core/rocs-cli"
          type: "build"
          note: "./scripts/rocs.sh resolves ROCS_BIN, then the workspace core/rocs-cli (or ROCS_CORE_PROJECT), then rocs on PATH"
        - name: "engineering-core"
          type: "build"
          note: "The elixir, ts and ts-frontend engineering lanes: policy/engineering-lane.json points at them, docs/engineering.local.md holds the local overrides"
        - name: "plug, bandit, jason and exqlite"
          type: "runtime"
          note: "HTTP gateway, JSON and the per-workspace SQLite resource"
        - name: "GitHub Actions"
          type: "infra"
          note: ".github/workflows/ci.yml builds the SDK and UI, runs mix test and scripts/validate_repo.py"
      anti_goals:
        - "Agents calling tools directly; they request governed capabilities instead"
        - "Hidden authority: architecture v2 removed it after skeptical critique and v3 keeps it out"
        - "Growing the control plane past 20 core modules"
    compass:
      drivers:
        - "Agent systems need explicit authority boundaries instead of hidden tool access (docs/project/purpose.md)"
      outcomes:
        - "Every meaningful agent action is visible, policy-checked, optionally human-approved and auditable (docs/project/vision.md)"
        - "Capable agent systems run on a compact BEAM core with practical gateway, SDK and UI surfaces"
        - "The repository stays reproducible through its deterministic generator (docs/project/mission.md)"
      tradeoffs:
        - decision: "Tools or capabilities"
          chosen: "Agents request governed capabilities that execute against supervised resources"
          because: "It is v3's single invariant (docs/architecture/architecture_v3.md)"
        - decision: "Where runtime logic lives"
          chosen: "Elixir/OTP; TypeScript only for the UI, SDK and adapters"
          because: "OTP supervises resource processes and keeps authority local; the TypeScript layer never owns runtime authority"
        - decision: "Control-plane size"
          chosen: "v3 simplified v2 to fewer than 20 core modules"
          because: "Small enough to understand, explicit enough to trust (architecture_v3.md)"
    engine:
      triggers:
        - "POST /executions with a workspace, requester, capability and arguments"
        - "POST /approvals/{id}/approve or /deny by an operator"
        - "python3 scripts/cathedral_generator.py --out generated"
      states:
        - name: "REQUESTED / POLICY_EVALUATED / PENDING_APPROVAL / APPROVED / RUNNING"
          meaning: "An execution in flight; PENDING_APPROVAL is the pause and resume edge"
        - name: "COMPLETED / FAILED / DENIED / TIMED_OUT"
          meaning: "Terminal outcomes"
      invariants:
        - id: "AC-INV-001"
          statement: "Policy evaluation is deterministic and first-match-wins; a capability no rule matches is denied"
          enforcement: "test: config/config.exs (deny-by-default rule), apps/policy/test/apex/policy/engine_test.exs"
        - id: "AC-INV-002"
          statement: "A capability that needs approval pauses in PENDING_APPROVAL and runs only once approved"
          enforcement: "test: apps/runtime/test/apex/runtime/approval_resume_test.exs"
        - id: "AC-INV-003"
          statement: "A DRY_RUN_ONLY capability is denied in EXECUTE mode"
          enforcement: "test: apps/gateway/test/apex/gateway/router_test.exs"
        - id: "AC-INV-004"
          statement: "The twelve named core modules exist and docs/openapi.yaml lists every required endpoint"
          enforcement: "test: scripts/validate_repo.py, run in .github/workflows/ci.yml"
        - id: "AC-INV-005"
          statement: "Audit is append-only and queryable"
          enforcement: "policy: docs/architecture/architecture_v3.md; no test covers apps/audit"
      lifecycle:
        - "An agent sends a capability request to the gateway"
        - "The capability registry resolves it and the policy engine decides"
        - "The approval manager pauses it when the decision requires approval"
        - "The execution manager runs it on a supervised resource or provider"
        - "Every meaningful state transition emits an audit event to the store and the event stream"
    fog:
      assumptions:
        - id: "AC-A-001"
          statement: "The runtime compiles and passes its tests; the README notes the imported code was authored without an Elixir toolchain"
          how_to_validate: "mix test and python3 scripts/validate_repo.py, as .github/workflows/ci.yml runs them"
        - id: "AC-A-002"
          statement: "The generator still reproduces this repository's architecture documents"
          how_to_validate: "python3 scripts/cathedral_generator.py --out generated, then compare its docs/architecture/ and .apex-cathedral/manifest.json"
      risks:
        - id: "AC-R-001"
          statement: "A policy misconfiguration grants more than intended"
          mitigation: "Deny by default (AC-INV-001); the default policy in config/config.exs allows only read effects without approval and requires approval for file writes and SQL execute"
        - id: "AC-R-002"
          statement: "A provider crashes or a resource is contended mid-execution"
          mitigation: "Monitored executions fail visibly with an audit trail; the resource process serializes contention (architecture_v3.md Failure handling)"
        - id: "AC-R-003"
          statement: "A manual publish ships the SDK as a public npm package (rename prepared under AK 6140)"
          mitigation: "publish-ts-sdk.yml runs only on workflow_dispatch, after npm run check, build and pack --dry-run"
      exceptions:
        - id: "AC-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "AC-D-001"
          statement: "The core-module budget check in scripts/validate_repo.py counts its own constant list, not the repo's modules, so it cannot fail"
          payoff_plan: "Not scheduled"
        - id: "AC-D-002"
          statement: "apps/audit and apps/resources have no tests"
          payoff_plan: "Not scheduled"
        - id: "AC-D-003"
          statement: "AGENTS.md still sends deferred work to governance/work-items.json, a projection the AK work-items surface deprecated on 2026-08-22; docs/project/strategic_goals.md and tactical_goals.md are empty templates"
          payoff_plan: "Not scheduled"
        - id: "AC-D-004"
          statement: "The scaffold metadata says language bash and no software pack, because tpl-project-repo had no elixir option (docs/project/transition-summary.md)"
          payoff_plan: "Not scheduled"
