name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/ts-sdk/package-lock.json
            apps/ui/package-lock.json

      - name: Install TS SDK dependencies
        working-directory: apps/ts-sdk
        run: npm ci

      - name: Validate TS SDK
        working-directory: apps/ts-sdk
        run: |
          npm run check
          npm run build
          npm pack --dry-run

      - name: Install UI dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Build UI
        working-directory: apps/ui
        run: npm run build

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.0'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run test suite
        run: mix test

      - name: Run repo validator
        run: python3 scripts/validate_repo.py
