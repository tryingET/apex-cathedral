version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    environment:
      PORT: "4100"
      APEX_STORAGE_ROOT: /app/var/apex
    volumes:
      - ./var/apex:/app/var/apex
    ports:
      - "4100:4100"

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:4100
    ports:
      - "5173:5173"
    depends_on:
      - gateway
